name: checks

on:
  push:
    branches: [main, web-desktop]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

jobs:
  repo-web-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: host/.bun-version
      - name: 仓库内容（大文件、日志、文档登记）
        run: python3 tools/repo_check.py --all
      - name: 网页：安装、类型检查、测试
        run: |
          pnpm --dir web install --frozen-lockfile
          pnpm --dir web typecheck
          pnpm --dir web test:app
      - name: 后端：安装与类型检查（集成测试要 PG/Redis，不在 CI 跑）
        run: |
          pnpm --dir server install --frozen-lockfile
          pnpm --dir server typecheck
      - name: 新宿主：安装、类型检查与存储测试
        working-directory: host
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          bun test

  backend-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: maomao
          POSTGRES_PASSWORD: maomao
          POSTGRES_DB: maomao_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U maomao -d maomao_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://maomao:maomao@localhost:5432/maomao_test
      MODEL_PROVIDER: mock
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 后端：安装依赖并迁移隔离 PG 测试库
        run: |
          pnpm --dir server install --frozen-lockfile
          pnpm --dir server db:migrate
      - name: 后端：mock 模型集成测试（共享数据库串行执行）
        run: pnpm --dir server test --no-file-parallelism

  swift-and-shared-rules:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - name: 跨端规则（行为表、氛围关键帧、地点、场景版本、生成物）
        run: python3 tools/check_shared_rules.py
      - name: iOS 世界层逻辑测试
        run: sh tools/check_world_logic.sh
      - name: 宿主：安装小院与后端打包依赖
        run: |
          pnpm --dir web install --frozen-lockfile
          pnpm --dir server install --frozen-lockfile
      - name: 宿主：构建捆绑资源与混合配置探针
        run: |
          bash desktop/macos/scripts/build-app.sh
          node --input-type=module <<'NODE'
          import { createRequire } from 'node:module';
          import { resolve } from 'node:path';

          const require = createRequire(resolve('server/scripts/bundle-host.mjs'));
          const { build } = require(require.resolve('esbuild', { paths: [require.resolve('tsx')] }));
          await build({
            entryPoints: [resolve('desktop/macos/scripts/model-config-probe.ts')],
            bundle: true,
            platform: 'node',
            target: 'node22',
            format: 'esm',
            outfile: resolve(process.env.RUNNER_TEMP, 'model-config-probe.mjs'),
          });
          NODE
      - name: macOS 宿主 SwiftPM 测试
        env:
          CATTT_HYBRID_CHECK_RESOURCES: ${{ github.workspace }}/desktop/macos/build/Cattt.app/Contents/Resources
          CATTT_HYBRID_MODEL_PROBE: ${{ runner.temp }}/model-config-probe.mjs
          CATTT_HYBRID_CHECK_DATA_ROOT: ${{ runner.temp }}
          CATTT_MODEL_SETUP_RESOURCES: ${{ github.workspace }}/desktop/macos/build/Cattt.app/Contents/Resources
        run: swift test --package-path desktop/macos
