name: macOS DMG
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version (X.Y.Z)
        default: '0.1.0'
        required: true
  push:
    tags: ['mac-v*']
permissions:
  contents: read
jobs:
  package:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - run: |
          pnpm --dir web install --frozen-lockfile
          pnpm --dir server install --frozen-lockfile
      - name: Build, sign and notarize
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          APPLE_DEVELOPER_ID_APPLICATION: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION }}
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
        run: |
          export CATTT_VERSION="${RELEASE_VERSION:-${GITHUB_REF_NAME#mac-v}}"
          bash desktop/macos/scripts/package-dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Cattt-macOS-arm64
          path: desktop/macos/build/Cattt-*-arm64.dmg
          if-no-files-found: error
