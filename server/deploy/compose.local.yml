# 只用于本机镜像验收，独立卷、端口和网络，不连接开发库。
name: cattt-phase5-local
x-local-environment: &local-environment
  APP_ENV: development
  MODEL_PROVIDER: mock
  MAOMAO_DEEPSEEK_API_KEY: ""
  APNS_TEAM_ID: ""
  APNS_KEY_ID: ""
  APNS_PRIVATE_KEY_FILE: ""
services:
  api:
    environment: *local-environment
    ports: ["127.0.0.1:8887:8787"]
    depends_on:
      pg: {condition: service_healthy}
  worker:
    environment: *local-environment
    depends_on:
      pg: {condition: service_healthy}
  migrate:
    environment: *local-environment
  proxy:
    ports: !override ["127.0.0.1:8843:443"]
    volumes: !override
      - ./Caddyfile.local:/etc/caddy/Caddyfile:ro
      - local-tls:/data
  pg:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: cattt_test
      POSTGRES_PASSWORD: local-only
      POSTGRES_DB: cattt_test
    ports: ["127.0.0.1:15432:5432"]
    volumes: [local-pg:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cattt_test"]
      interval: 2s
      retries: 20
volumes:
  local-pg:
  local-tls:
