# 此包不创建或复用开发数据库。正式测试环境必须提供独立托管URL。
name: cattt-staging
x-runtime: &runtime
  image: ${CATTT_IMAGE:?set immutable image tag or digest}
  restart: unless-stopped
  environment: &environment
    APP_ENV: ${APP_ENV:-staging}
    MODEL_PROVIDER: ${MODEL_PROVIDER:-deepseek}
    DATABASE_URL: ${DATABASE_URL:?set isolated staging PG URL}
    MAOMAO_DEEPSEEK_API_KEY: ${MAOMAO_DEEPSEEK_API_KEY:-}
    APPLE_CLIENT_ID: ${APPLE_CLIENT_ID:-}
    APNS_TOPIC: ${APNS_TOPIC:-}
    APNS_TEAM_ID: ${APNS_TEAM_ID:-}
    APNS_KEY_ID: ${APNS_KEY_ID:-}
    APNS_PRIVATE_KEY_FILE: ${APNS_PRIVATE_KEY_FILE:-}
    AGENT_ENABLED: ${AGENT_ENABLED:-true}
    MODEL_DAILY_CALL_LIMIT: ${MODEL_DAILY_CALL_LIMIT:-120}
    MODEL_DAILY_TOKEN_LIMIT: ${MODEL_DAILY_TOKEN_LIMIT:-2000000}
    PORT: "8787"
  volumes:
    - ./secrets:/run/secrets:ro
services:
  api:
    <<: *runtime
  worker:
    <<: *runtime
    command: ["node", "--import", "tsx", "src/worker.ts"]
    healthcheck:
      test: ["CMD", "node", "scripts/worker-health.mjs"]
      interval: 15s
      timeout: 5s
      start_period: 30s
  migrate:
    <<: *runtime
    restart: "no"
    command: ["pnpm", "db:migrate"]
    profiles: ["maintenance"]
    healthcheck:
      disable: true
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_HOST: ${SITE_HOST:?set HTTPS hostname}
    ports: ["443:443", "80:80"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - tls-data:/data
volumes:
  tls-data:
