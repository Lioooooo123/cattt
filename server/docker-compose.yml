# 本机开发用的 PG。端口只绑 127.0.0.1。
name: maomao
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: maomao
      POSTGRES_PASSWORD: maomao
      POSTGRES_DB: maomao
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maomao"]
      interval: 2s
      retries: 15
volumes:
  pgdata:
